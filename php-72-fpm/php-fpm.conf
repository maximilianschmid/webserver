; This file was initially adapated from the output of: (on PHP 5.6)
;   grep -vE '^;|^ *$' /usr/local/etc/php-fpm.conf.default

[global]

error_log = /proc/self/fd/2
daemonize = no

[www]

user = www-data
group = www-data

listen = [::]:9072

; Sized for an 8 GB host shared with the php-56 pool and MySQL:
; 10 workers x 256M memory_limit is a theoretical worst case; typical
; TYPO3 request RSS is far lower.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.status_path = /php/fpm/status

clear_env = no

catch_workers_output = yes

php_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
php_admin_value[date.timezone] = "Europe/Amsterdam"
